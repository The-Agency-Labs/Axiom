version: "2"
sql:
  - engine: sqlite
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        output_db_file_name: queries_db.go
        output_models_file_name: models.go
        emit_json_tags: true
        json_tags_case_style: snake
