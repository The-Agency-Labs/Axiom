version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "gomod"
    directory: "/server"
    schedule:
      interval: "weekly"
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "weekly"
