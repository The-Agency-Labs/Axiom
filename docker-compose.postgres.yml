services:
  encompass:
    container_name: encompass
    image: ghcr.io/the-agency-labs/encompass
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      - TZ=Europe/Berlin
      - SECRET=longstring
      - REDIS_URL=redis://redis:6379
      - DB_HOST=db
      - DB_NAME=encompass
      - DB_USER=encompass
      - DB_PASSWORD=encompass
      - DB_PORT=5432
    ports:
      - "8000:8000"

  db:
    image: postgres:16-alpine
    container_name: encompass-db
    environment:
      - POSTGRES_DB=encompass
      - POSTGRES_USER=encompass
      - POSTGRES_PASSWORD=encompass
    volumes:
      - ./db:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    container_name: encompass-redis
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
