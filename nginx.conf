user abc;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout combined;

    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 20M;
    client_body_buffer_size 256k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    upstream app_server {
        server 127.0.0.1:23847;
    }

    server {
        listen 8000;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Django: API, KOSync, media-server webhooks, account and settings pages,
        # imports and admin. Everything else is the web app.
        location ~ ^/(api|kosync|webhook|health|admin|accounts|settings|import|export|notifications|test_notification|regenerate_token|clear_search_cache|delete_import_schedule|update_plex_usernames|update_jellyfin_webhook_events|calendar|reload_calendar|lists|list|list_item_toggle|lists_modal|select2|jsi18n|signup|logout|password)(/|$) {
            proxy_pass http://app_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /health/ {
            access_log off;
            proxy_pass http://app_server;
            proxy_set_header Host $http_host;
        }

        # Web app: hashed assets cache forever, routes fall back to the SPA shell.
        location /_app/immutable/ {
            root /encompass/frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
        }

        location / {
            root /encompass/frontend;
            try_files $uri $uri/ /200.html;
            add_header Cache-Control "no-cache";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
        }

        # Static files
        location /static/ {
            alias /encompass/staticfiles/;
            expires 30d;
            add_header Cache-Control "public";
        }

    }
}