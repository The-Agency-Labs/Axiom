services:
  encompass:
    container_name: encompass
    image: ghcr.io/the-agency-labs/encompass
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - TZ=Europe/Berlin
      - SECRET=longstring
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./db:/encompass/db
    ports:
      - "8000:8000"

  redis:
    container_name: encompass-redis
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
